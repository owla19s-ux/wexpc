[package]
name = "wex-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "wex_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
wex-protocol = { path = "../../crates/wex-protocol" }
wex-access-store = { path = "../../crates/wex-access-store" }
wex-core = { path = "../../crates/wex-core" }
wex-local-resources = { path = "../../crates/wex-local-resources" }
wex-workspace-store = { path = "../../crates/wex-workspace-store" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
