[package]
name = "wex-desktop-service"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
wex-core = { path = "../wex-core" }
wex-local-resources = { path = "../wex-local-resources" }
wex-api = { path = "../wex-api" }

[dev-dependencies]
tempfile = "3"
