name: WEXPC safe merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/ci-requests/branch-cleanup/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete-confirmed-merged:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete second verified merged branch batch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="owla19s-ux/wexpc"
          [[ "${GITHUB_REPOSITORY}" == "$repo" && "${GITHUB_REF}" == "refs/heads/main" ]] || exit 1
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in \
            'integration/dispatch-core-rebase-20261026' \
            'integration/p1-lease-scope-fix-20261027' \
            'integration/pc-git-terminal-consistency-20261025-1723' \
            'integration/pc-local-policy-resume-20261025' \
            'integration/pc-local-reply-recovery-20261025-1930' \
            'integration/pc-tool-ui-api-combined-20261025-1925' \
            'integration/ui-github-revoke-recovery-20261025' \
            'integration/ui-task-duty-revision-20261025' \
            'review/process-legacy-capture-status-20261026' \
            'test/p1-git-ambient-env-regression-20261026' \
            'work/durable-evidence-batches-20261026' \
            'work/process-cancel-20261026' \
            'feat/api-protocol-proposal' \
            'feat/p1-git-commit-preflight-20261026' \
            'feat/pc-agent-task-state'; do
            [[ "$branch" != "main" && "$branch" != "feat/pc-scope-overlap-pure-2026-10-25" ]] || exit 1
            sha="$(git rev-parse --verify "refs/remotes/origin/$branch")"
            git merge-base --is-ancestor "$sha" origin/main || { echo "SKIP unmerged: $branch"; continue; }
            current="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            [[ "$current" == "$sha" ]] || { echo "SKIP changed: $branch"; continue; }
            if gh api "repos/$repo/pulls?state=open&per_page=100" --jq '.[].head.ref' | grep -Fxq "$branch"; then
              echo "SKIP open PR: $branch"
              continue
            fi
            echo "Deleting confirmed merged branch $branch @ $sha"
            git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"
          done
