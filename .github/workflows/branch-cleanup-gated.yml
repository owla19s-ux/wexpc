name: WEXPC safe merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/ci-requests/branch-cleanup/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete-confirmed-merged:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Archive and delete one byte-identical recovered branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="owla19s-ux/wexpc"
          [[ "${GITHUB_REPOSITORY}" == "$repo" && "${GITHUB_REF}" == "refs/heads/main" ]] || exit 1
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in \
            'fix/ui-task-journal-revision-reload-20261025'; do
            [[ "$branch" != "main" && "$branch" != "feat/pc-scope-overlap-pure-2026-10-25" ]] || exit 1
            sha="$(git rev-parse --verify "refs/remotes/origin/$branch")"
            case "$branch" in
              fix/ui-task-journal-revision-reload-20261025)
                expected="29f38447cc854ce575b5c295ef46df611985fc8c" ;;
              *) exit 1 ;;
            esac
            [[ "$sha" == "$expected" ]] || { echo "SKIP changed head $branch"; continue; }
            base="$(git merge-base "$sha" origin/main)"
            mapfile -t changed < <(git diff --name-only "$base" "$sha")
            [[ "${#changed[@]}" -gt 0 ]] || { echo "SKIP empty diff $branch"; continue; }
            identical=true
            for file in "${changed[@]}"; do
              old_blob="$(git rev-parse "$sha:$file" 2>/dev/null)" || { identical=false; break; }
              new_blob="$(git rev-parse "origin/main:$file" 2>/dev/null)" || { identical=false; break; }
              [[ "$old_blob" == "$new_blob" ]] || { identical=false; break; }
            done
            [[ "$identical" == true ]] || { echo "SKIP content mismatch $branch"; continue; }
            current="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            [[ "$current" == "$sha" ]] || { echo "SKIP changed: $branch"; continue; }
            if gh api "repos/$repo/pulls?state=open&per_page=100" --jq '.[].head.ref' | grep -Fxq "$branch"; then
              echo "SKIP open PR: $branch"
              continue
            fi
            echo "Deleting confirmed merged branch $branch @ $sha"
            archive_ref="refs/tags/archive/wexpc-20261027/$branch"
            [[ -z "$(git ls-remote origin "$archive_ref")" ]] || { echo "SKIP archive already exists: $archive_ref"; continue; }
            git push origin "$sha:$archive_ref"
            archived="$(git ls-remote origin "$archive_ref" | cut -f1)"
            [[ "$archived" == "$sha" ]] || { echo "ERROR archive unavailable"; exit 1; }
            git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"
          done
