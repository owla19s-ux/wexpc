name: WEXPC safe merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/ci-requests/branch-cleanup/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete-confirmed-merged:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete third verified merged branch batch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="owla19s-ux/wexpc"
          [[ "${GITHUB_REPOSITORY}" == "$repo" && "${GITHUB_REF}" == "refs/heads/main" ]] || exit 1
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in \
            'feat/pc-api-desktop-integration-20261025' \
            'feat/pc-desktop-foundation-2026-10-24' \
            'feat/pc-desktop-task-core-integration-20261025' \
            'feat/ui-scoped-settings-20261026-1639' \
            'fix/api-protocol-boundaries-20261025' \
            'fix/api-text-completion-role-terminal-20261025' \
            'fix/p1-git-environment-fence-20261026' \
            'fix/pc-github-postwrite-readback-20261025' \
            'fix/pc-task-link-reassignment-20261025' \
            'fix/ui-await-latest-snapshot-20261026-1232' \
            'fix/ui-dispatch-recheck-pending-20261026-1130' \
            'fix/ui-project-chat-navigation-20261025' \
            'fix/ui-reconcile-failed-mutations-20261026-1025' \
            'fix/ui-snapshot-freshness-20261026-0825' \
            'fix/ui-tool-result-after-request-20261025' \
            'fix/ui-verified-connection-creation-20261026' \
            'ui-api-connection-freshness-20261026'; do
            [[ "$branch" != "main" && "$branch" != "feat/pc-scope-overlap-pure-2026-10-25" ]] || exit 1
            sha="$(git rev-parse --verify "refs/remotes/origin/$branch")"
            git merge-base --is-ancestor "$sha" origin/main || { echo "SKIP unmerged: $branch"; continue; }
            current="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            [[ "$current" == "$sha" ]] || { echo "SKIP changed: $branch"; continue; }
            if gh api "repos/$repo/pulls?state=open&per_page=100" --jq '.[].head.ref' | grep -Fxq "$branch"; then
              echo "SKIP open PR: $branch"
              continue
            fi
            echo "Deleting confirmed merged branch $branch @ $sha"
            git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"
          done
