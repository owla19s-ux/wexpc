name: WEXPC safe merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/ci-requests/branch-cleanup/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete-confirmed-merged:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify equivalent task index before deleting one divergent branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="owla19s-ux/wexpc"
          [[ "${GITHUB_REPOSITORY}" == "$repo" && "${GITHUB_REF}" == "refs/heads/main" ]] || exit 1
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in \
            'feat/task-operation-bidirectional-index-20261026'; do
            [[ "$branch" != "main" && "$branch" != "feat/pc-scope-overlap-pure-2026-10-25" ]] || exit 1
            sha="$(git rev-parse --verify "refs/remotes/origin/$branch")"
            [[ "$sha" == "47b0da609e196a6f7ffc357d725d9093ca573a4c" ]] || { echo "SKIP unexpected head: $branch"; continue; }
            # Single ahead commit changes only task_operation.rs; its changes
            # versus main are formatting-only. Recheck the source via git.
            old_source="$(git show "$sha:crates/wex-core/src/task_operation.rs" | tr -d '[:space:]' | sha256sum | cut -d' ' -f1)"
            main_source="$(git show "origin/main:crates/wex-core/src/task_operation.rs" | tr -d '[:space:]' | sha256sum | cut -d' ' -f1)"
            [[ "$old_source" == "$main_source" ]] || { echo "SKIP non-format changes: $branch"; continue; }
            current="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            [[ "$current" == "$sha" ]] || { echo "SKIP changed: $branch"; continue; }
            if gh api "repos/$repo/pulls?state=open&per_page=100" --jq '.[].head.ref' | grep -Fxq "$branch"; then
              echo "SKIP open PR: $branch"
              continue
            fi
            echo "Deleting confirmed merged branch $branch @ $sha"
            git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"
          done
