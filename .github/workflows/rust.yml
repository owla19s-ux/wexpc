# WEXPC 0.1.1 gated validation. Intentionally manual-only:
# do not enable push/pull_request/schedule triggers during branch consolidation.
name: WEXPC 0.1.1 validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Choose one validation suite; all includes Linux, frontend and Windows"
        type: choice
        required: true
        default: linux
        options:
          - linux
          - frontend
          - windows
          - flutter-reference
          - all

permissions:
  contents: read

concurrency:
  group: wexpc-validation-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  linux:
    if: ${{ inputs.suite == 'linux' || inputs.suite == 'all' }}
    name: Rust Linux / fmt + Clippy + workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked

  frontend:
    if: ${{ inputs.suite == 'frontend' || inputs.suite == 'all' }}
    name: Desktop UI / TypeScript + Vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: TypeScript and production frontend build
        run: npm run build

  windows:
    if: ${{ inputs.suite == 'windows' || inputs.suite == 'all' }}
    name: Windows Rust + backend contracts + Tauri compile check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Windows workspace tests
        run: cargo test --workspace --locked
      - name: Windows local resource contracts
        run: cargo test -p wex-local-resources --test windows_contract --locked -- --nocapture
      - name: Windows storage contracts
        run: cargo test -p wex-access-store --test windows_store --locked -- --nocapture
      - name: Tauri backend compilation check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  flutter-reference:
    if: ${{ inputs.suite == 'flutter-reference' }}
    name: Archived Flutter reference (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reference/flutter-android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub test/extensions test/platform test/shell_test.dart
