name: rust

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: windows (test)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Platform backend contract tests
        run: cargo test -p wex-local-resources --test windows_contract -- --nocapture
      - name: Storage backend contract tests
        run: cargo test -p wex-access-store --test windows_store -- --nocapture

  flutter:
    name: flutter (analyze)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: reference/flutter-android
        run: flutter pub get
      - name: Analyze
        working-directory: reference/flutter-android
        run: flutter analyze --no-pub
      - name: Pure Dart widget tests
        working-directory: reference/flutter-android
        run: flutter test --no-pub test/extensions test/platform test/shell_test.dart
