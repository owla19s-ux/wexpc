# WEXPC 0.1.1 gated validation.
# Normal code pushes and pull requests never trigger tests. Only explicit
# requests committed under .github/ci-requests/linux/ on main trigger Linux.
name: WEXPC 0.1.1 validation

on:
  push:
    branches: [main]
    paths:
      - '.github/ci-requests/linux/**'
  workflow_dispatch:
    inputs:
      suite:
        description: "Choose one validation suite; all includes Linux, frontend and Windows"
        type: choice
        required: true
        default: linux
        options:
          - linux
          - format-fix
          - frontend
          - windows
          - flutter-reference
          - all

permissions:
  contents: read

concurrency:
  group: wexpc-validation-${{ github.ref }}-${{ github.event_name }}-${{ inputs.suite || 'linux' }}
  cancel-in-progress: false

jobs:
  format-fix:
    if: ${{ inputs.suite == 'format-fix' && github.ref == 'refs/heads/main' }}
    name: Apply rustfmt on main (manual-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format all workspace Rust code
        run: cargo fmt --all
      - name: Commit only rustfmt changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update -- '*.rs'
          git commit -m 'style: apply workspace rustfmt [skip ci]'
          git push origin HEAD:main

  linux:
    if: ${{ github.event_name == 'push' || inputs.suite == 'linux' || inputs.suite == 'all' }}
    name: Rust Linux / fmt + Clippy + workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked

  frontend:
    if: ${{ inputs.suite == 'frontend' || inputs.suite == 'all' }}
    name: Desktop UI / TypeScript + Vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: TypeScript and production frontend build
        run: npm run build

  windows:
    if: ${{ inputs.suite == 'windows' || inputs.suite == 'all' }}
    name: Windows Rust + backend contracts + Tauri compile check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Windows workspace tests
        run: cargo test --workspace --locked
      - name: Windows local resource contracts
        run: cargo test -p wex-local-resources --test windows_contract --locked -- --nocapture
      - name: Windows storage contracts
        run: cargo test -p wex-access-store --test windows_store --locked -- --nocapture
      - name: Tauri backend compilation check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  flutter-reference:
    if: ${{ inputs.suite == 'flutter-reference' }}
    name: Archived Flutter reference (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reference/flutter-android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub test/extensions test/platform test/shell_test.dart
